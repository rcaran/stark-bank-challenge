[project]
name = "stark-bank-challenge"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
    "starkbank>=2.14.0",
    "apscheduler>=3.10.0",
    "validate-docbr>=1.10.0",
    "faker>=33.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0"
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear (detecta bugs comuns)
    "C4",     # flake8-comprehensions (melhora comprehensions)
    "UP",     # pyupgrade (moderniza sintaxe Python)
    "SIM",    # flake8-simplify (simplificações)
    "RET",    # flake8-return (melhora returns)
    "RUF",    # Ruff-specific rules
    "PTH",    # flake8-use-pathlib (uso de pathlib)
    "Q",      # flake8-quotes (consistência de aspas)
    "COM",    # flake8-commas (trailing commas)
    "PIE",    # flake8-pie (misc lints)
    "PERF",   # Perflint (performance)
    "FURB",   # refurb (modernizações Python)
]
ignore = [
    "COM812",  # trailing comma (conflita com formatter)
    "D203",    # blank line before class (conflita com D211)
    "D213",    # multi-line summary second line (conflita com D212)
    "B008",    # function-call-in-default-argument (padrão FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # permite assert em testes
    "ARG001",  # permite argumentos não usados em fixtures
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing -p no:flask"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
