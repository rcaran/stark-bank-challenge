# Docker Compose configuration for local development
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stark-bank-challenge
    ports:
      - "8000:8000"
    environment:
      # Application
      - APP_NAME=stark-bank-challenge
      - APP_ENV=${APP_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - API_PORT=${API_PORT}
      - API_HOST=${API_HOST}

      # Security
      - ADMIN_API_KEY=${ADMIN_API_KEY}

      # Stark Bank (set your credentials)
      - STARKBANK_PRIVATE_KEY_CONTENT=${STARKBANK_PRIVATE_KEY_CONTENT}
      - STARKBANK_PROJECT_ID=${STARKBANK_PROJECT_ID}
      - STARKBANK_ENVIRONMENT=${STARKBANK_ENVIRONMENT}

      # Database
      - DATABASE_URL=sqlite:////app/data/starkbank.db

      # Scheduler
      - SCHEDULER_INTERVAL_HOURS=3
      - INVOICE_GENERATION_MIN=8
      - INVOICE_GENERATION_MAX=12

    volumes:
      # Mount source code for hot-reload during development
      - ./src:/app/src
      # Persist database
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

